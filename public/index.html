<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function(){
        try {
          var p = localStorage.getItem('cv_theme') || 'dark';
          var t = p === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : p;
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07090D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F7FA" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Explore the crypto market with real-time intelligence, interactive charts, and powerful financial insights." />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Cryptoverse — Digital Asset Intelligence</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
